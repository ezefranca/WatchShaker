name: Documentation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build DocC site
    runs-on: macos-15
    timeout-minutes: 20
    env:
      WATCHSHAKER_DOCUMENTATION_BASE_URL: https://ezefranca.com/WatchShaker

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Build DocC archive
        env:
          WATCHSHAKER_DERIVED_DATA: ${{ runner.temp }}/WatchShakerDerivedData
        run: >-
          xcodebuild docbuild
          -scheme WatchShaker
          -destination 'generic/platform=watchOS Simulator'
          -derivedDataPath "$WATCHSHAKER_DERIVED_DATA"
          CODE_SIGNING_ALLOWED=NO
          DOCC_HOSTING_BASE_PATH=WatchShaker

      - name: Transform archive for static hosting
        env:
          WATCHSHAKER_DERIVED_DATA: ${{ runner.temp }}/WatchShakerDerivedData
          WATCHSHAKER_DOCUMENTATION_SITE: ${{ runner.temp }}/WatchShakerDocumentation
        run: |
          xcrun docc process-archive transform-for-static-hosting \
            "$WATCHSHAKER_DERIVED_DATA/Build/Products/Debug-watchsimulator/WatchShaker.doccarchive" \
            --output-path "$WATCHSHAKER_DOCUMENTATION_SITE" \
            --hosting-base-path WatchShaker

          WATCHSHAKER_VERSION=$(git describe --tags --abbrev=0 --match '[0-9]*')
          python3 Scripts/prepare_documentation_site.py \
            --site "$WATCHSHAKER_DOCUMENTATION_SITE" \
            --base-url "$WATCHSHAKER_DOCUMENTATION_BASE_URL" \
            --version "$WATCHSHAKER_VERSION" \
            --repository-root "$GITHUB_WORKSPACE"

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/WatchShakerDocumentation

  deploy:
    name: Deploy DocC site
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
